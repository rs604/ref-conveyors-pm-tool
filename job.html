<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job — Ref Conveyors Project Tracker</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.crumb{font-size:12.5px; color:var(--text-faint); margin-bottom:10px;}
.crumb b{color:var(--text); font-weight:600;}
.project-header{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px 24px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap;}
.ph-left h1{font-size:20px; font-weight:700; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.ph-sub{font-size:13px; color:var(--text-muted); margin-top:4px;}
.ph-stats{display:flex; gap:26px;}
.ph-stat{text-align:right;}
.ph-stat-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:600;}
.ph-stat-value{font-family:'Manrope',sans-serif; font-size:20px; font-weight:700; margin-top:4px;}
.task-no{color:var(--text-faint); font-weight:600; font-size:11.5px; text-align:center;}
.date-pair{font-size:12px; color:var(--text-muted); white-space:nowrap; padding:6px 8px;}
.date-pair b{color:var(--text); font-weight:600;}
.delay-tag{font-size:11px; color:var(--warn-text); font-weight:600;}

/* ---- Project status controls (header) ---- */
.project-actions{display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap;}
.btn-status{border:1.5px solid var(--border-strong); background:var(--surface); color:var(--text-muted); padding:6px 13px; border-radius:7px; font-size:11.5px; font-weight:600;}
.btn-status:hover{background:var(--surface-2);}
.btn-status.active{border-color:var(--accent); color:var(--accent-text); background:var(--accent-soft);}
.btn-status.hold.active{border-color:var(--warn-text); color:var(--warn-text); background:var(--warn-soft);}

/* ---- Spreadsheet-style task grid ---- */
.tasks-panel{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 1px 2px rgba(20,24,40,0.03); overflow:hidden;}
.tasks-scroll{max-height:calc(100vh - 320px); min-height:220px; overflow:auto; position:relative;}
.tasks-scroll table{table-layout:fixed; border-collapse:collapse; font-size:12.5px;}
.tasks-scroll thead th{position:sticky; top:0; z-index:3; white-space:nowrap;}
.tasks-scroll td{padding:0; vertical-align:top;}
.tasks-add-row{padding:12px 16px; border-top:1px solid var(--border);}

.tasks-scroll th:nth-child(1), .tasks-scroll td:nth-child(1){width:42px;}
.tasks-scroll th:nth-child(2), .tasks-scroll td:nth-child(2){width:180px;}
.tasks-scroll th:nth-child(3), .tasks-scroll td:nth-child(3){width:180px;}
.tasks-scroll th:nth-child(4), .tasks-scroll td:nth-child(4){width:64px;}
.tasks-scroll th:nth-child(5), .tasks-scroll td:nth-child(5){width:84px;}
.tasks-scroll th:nth-child(6), .tasks-scroll td:nth-child(6){width:150px;}
.tasks-scroll th:nth-child(7), .tasks-scroll td:nth-child(7){width:126px;}
.tasks-scroll th:nth-child(8), .tasks-scroll td:nth-child(8){width:126px;}
.tasks-scroll th:nth-child(9), .tasks-scroll td:nth-child(9){width:150px;}
.tasks-scroll th:nth-child(10), .tasks-scroll td:nth-child(10){width:64px;}
.tasks-scroll th:nth-child(11), .tasks-scroll td:nth-child(11){width:104px;}
.tasks-scroll th:nth-child(12), .tasks-scroll td:nth-child(12){width:38px;}

/* A .cell is the "selected, not editing" state — a plain focusable div.
   Clicking/arrowing onto it just selects it; typing or Enter/F2/double-click
   is what switches it into .editing (an <input> appears inside it). This
   two-state model (rather than a permanently-live <input>) is what lets
   arrow keys mean "move between cells" while selected but "move the text
   cursor" while editing, matching Sheets/Excel. */
.cell{position:relative; min-height:19px; padding:6px 8px; cursor:cell; outline:none; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cell:focus{box-shadow:inset 0 0 0 2px var(--accent); background:var(--accent-soft); z-index:1;}
.cell.editing{box-shadow:inset 0 0 0 2px var(--accent); background:var(--surface); white-space:normal; overflow:visible; z-index:4;}
.cell:empty::before, .cell.combo-cell:empty::before{content:"\2014"; color:var(--text-faint);}
.num-cell{text-align:right;}
.combo-cell{padding-right:20px;}
.combo-caret{position:absolute; right:6px; top:50%; transform:translateY(-50%); font-size:8px; color:var(--text-faint); pointer-events:none;}
.cell.editing .combo-caret{display:none;}

.cell-input{width:100%; border:none; outline:none; background:transparent; font:inherit; color:var(--text); padding:0; box-sizing:border-box;}
/* position:fixed (not absolute) so the list escapes the .tasks-scroll
   container's overflow:auto clipping — an absolutely-positioned list would
   get cut off for any row near the bottom (or edge) of the scroll viewport.
   Its top/left/bottom are set from JS (positionComboList) since fixed
   coordinates are viewport-relative, not relative to the cell. */
.combo-list{position:fixed; max-height:220px; overflow-y:auto; background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; box-shadow:0 10px 28px rgba(20,24,40,0.14); z-index:50; padding:4px; white-space:nowrap;}
.combo-option{padding:6px 10px; border-radius:6px; font-size:12.5px; cursor:pointer;}
.combo-option.highlighted{background:var(--accent-soft); color:var(--accent-text);}
.combo-empty{padding:6px 10px; font-size:11.5px; color:var(--text-faint); white-space:normal; max-width:220px;}

.btn-remove-row{background:none; border:none; color:var(--text-faint); font-size:15px; line-height:1; padding:5px 8px; border-radius:6px;}
.btn-remove-row:hover{color:var(--warn-text); background:var(--warn-soft);}
.ro-cell{padding:6px 8px;}
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-area">
    <header class="page-header">
      <div class="ph-titles">
        <h1 id="crumb-job">Job Detail</h1>
        <p class="muted">Projects / job detail</p>
      </div>
      <div id="header-user-root"></div>
    </header>
    <main class="content">
      <div class="project-header" id="project-header"><p class="muted">Loading…</p></div>
      <div class="tasks-panel">
        <div class="tasks-scroll" id="tasks-scroll">
          <div class="empty-state" id="tasks-loading"><p>Loading…</p></div>
        </div>
        <div class="tasks-add-row">
          <button type="button" class="btn-secondary" id="add-item-btn">+ Add Item</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script>
const jobId = new URLSearchParams(window.location.search).get("id");

let currentJob = null;
let currentTasks = [];
let profilesList = [];
let supervisorNameById = {};

const PROJECT_STATUS_PILL = {
  not_started: ["status-notstarted", "Not Started"],
  in_progress: ["status-ontrack", "In Progress"],
  on_hold: ["status-delayed", "On Hold"],
  completed: ["status-completed", "Completed"],
};

function projectStatusPillHtml(status) {
  const [cls, label] = PROJECT_STATUS_PILL[status] || PROJECT_STATUS_PILL.not_started;
  return `<span class="status-pill ${cls}"><span class="dot"></span>${label}</span>`;
}

function renderHeader() {
  const job = currentJob;
  const supervisor = job.supervisor_id ? supervisorNameById[job.supervisor_id] : null;
  const total = currentTasks.length;
  const completed = currentTasks.filter(t => t.status === "completed").length;

  document.getElementById("project-header").innerHTML = `
    <div class="ph-left">
      <h1>${escapeHtml(job.job_no)} — ${escapeHtml(job.customer_name)} <span class="tag">${escapeHtml(job.product_types?.name || "—")}</span></h1>
      <div class="ph-sub">${supervisor ? "Supervisor " + escapeHtml(supervisor) : "No supervisor assigned"}</div>
      <div class="project-actions">
        ${projectStatusPillHtml(job.project_status)}
        <button type="button" class="btn-status ${job.project_status === "in_progress" ? "active" : ""}" id="btn-mark-started">Mark Started</button>
        <button type="button" class="btn-status hold ${job.project_status === "on_hold" ? "active" : ""}" id="btn-on-hold">On Hold</button>
      </div>
    </div>
    <div class="ph-stats">
      <div class="ph-stat"><div class="ph-stat-label">Planned Start</div><div class="ph-stat-value" style="font-size:15px;">${formatDate(job.planned_start_date)}</div></div>
      <div class="ph-stat"><div class="ph-stat-label">Target</div><div class="ph-stat-value" style="font-size:15px;">${formatDate(job.target_date)}</div></div>
      <div class="ph-stat"><div class="ph-stat-label">Actual Start</div><div class="ph-stat-value" style="font-size:15px;">${formatDate(job.actual_start_date)}</div></div>
      <div class="ph-stat"><div class="ph-stat-label">Completion</div><div class="ph-stat-value" id="completion-stat">${completed} / ${total}</div></div>
    </div>
  `;

  document.getElementById("btn-mark-started").addEventListener("click", () => updateProjectStatus("in_progress"));
  document.getElementById("btn-on-hold").addEventListener("click", () => updateProjectStatus("on_hold"));
}

async function updateProjectStatus(status) {
  const { data: updated, error } = await supabaseClient
    .from("jobs")
    .update({ project_status: status })
    .eq("id", jobId)
    .select("*, product_types(name)")
    .single();
  if (error) {
    alert("Couldn't update project status: " + error.message);
    return;
  }
  currentJob = updated;
  renderHeader();
}

function updateHeaderStats() {
  const total = currentTasks.length;
  const completed = currentTasks.filter(t => t.status === "completed").length;
  const el = document.getElementById("completion-stat");
  if (el) el.textContent = `${completed} / ${total}`;
}

/* =========================================================================
   Spreadsheet grid engine
   =========================================================================
   Every editable field is a `.cell` div (tabindex=0, one per row/column).
   A cell has two states:
     - selected (default): shows a plain text display, arrow keys move the
       active cell, typing/Enter/F2/double-click switches it to...
     - editing: an <input> (or, for Unit/Doer/Status, a searchable dropdown)
       replaces the display; arrow keys move the text cursor / filter the
       list instead of the active cell, and Enter/Tab/Escape commit or
       cancel and return to selected mode — this mirrors Google Sheets.
   ========================================================================= */

const COLUMNS = [
  { field: "item_name", type: "text" },
  { field: "task_description", type: "text" },
  { field: "qty", type: "number" },
  { field: "uom", type: "combo-uom" },
  { field: "doer_id", type: "combo-doer" },
  { field: "planned_start_date", type: "date" },
  { field: "planned_finish_date", type: "date" },
  { field: "status", type: "combo-status" },
];

const UOM_OPTIONS = ["Nos", "Pcs", "Set", "Kg", "Mtr", "MM", "Ltr", "Sqm", "Roll", "Box", "Pair", "RM"]
  .map(u => ({ value: u, label: u }));

const STATUS_OPTIONS = [
  { value: "pending", label: "Pending" },
  { value: "in_progress", label: "Started" },
  { value: "completed", label: "Completed" },
];
const STATUS_LABEL = Object.fromEntries(STATUS_OPTIONS.map(o => [o.value, o.label]));

function doerOptions() {
  return [{ value: "", label: "Unassigned" }, ...profilesList.map(p => ({ value: p.id, label: p.full_name }))];
}

function optionsForType(type) {
  if (type === "combo-uom") return UOM_OPTIONS;
  if (type === "combo-status") return STATUS_OPTIONS;
  if (type === "combo-doer") return doerOptions();
  return [];
}

function labelFor(type, value) {
  if (type === "combo-status") return STATUS_LABEL[value] || "Pending";
  if (type === "combo-doer") {
    if (!value) return "Unassigned";
    const p = profilesList.find(p => p.id === value);
    return p ? p.full_name : "Unassigned";
  }
  return value || "";
}

function escapeAttr(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function cellHtml(rowIdx, colIdx, t) {
  const col = COLUMNS[colIdx];
  const field = col.field;
  const rawValue = t[field] ?? "";
  const isCombo = col.type.startsWith("combo");
  let display = isCombo ? labelFor(col.type, rawValue) : (col.type === "date" ? formatDate(rawValue) : rawValue);
  if (isCombo && display === "") display = "—"; // caret makes the cell non-empty, so CSS :empty won't add this itself
  const extraClass = col.type === "number" ? "num-cell" : isCombo ? "combo-cell" : "";
  const caret = isCombo ? `<span class="combo-caret">&#9662;</span>` : "";
  return `<div class="cell ${extraClass}" tabindex="0" data-row="${rowIdx}" data-col="${colIdx}" data-id="${t.id}" data-field="${field}" data-type="${col.type}" data-value="${escapeAttr(rawValue)}">${escapeHtml(String(display))}${caret}</div>`;
}

function taskRowHtml(t, rowIdx) {
  return `
    <tr data-task-row="${t.id}">
      <td class="ro-cell task-no">${t.task_no}</td>
      <td>${cellHtml(rowIdx, 0, t)}</td>
      <td>${cellHtml(rowIdx, 1, t)}</td>
      <td>${cellHtml(rowIdx, 2, t)}</td>
      <td>${cellHtml(rowIdx, 3, t)}</td>
      <td>${cellHtml(rowIdx, 4, t)}</td>
      <td>${cellHtml(rowIdx, 5, t)}</td>
      <td>${cellHtml(rowIdx, 6, t)}</td>
      <td class="ro-cell date-pair actual-cell">${formatDate(t.actual_start_date)} → <b>${formatDate(t.actual_finish_date)}</b></td>
      <td class="ro-cell delay-cell">${t.delay_days > 0 ? `<span class="delay-tag">${t.delay_days}d</span>` : "—"}</td>
      <td>${cellHtml(rowIdx, 7, t)}</td>
      <td class="ro-cell"><button type="button" class="btn-remove-row" data-remove-task="${t.id}" title="Remove item">&times;</button></td>
    </tr>`;
}

function renderTasksTable() {
  const scroll = document.getElementById("tasks-scroll");
  if (!currentTasks.length) {
    scroll.innerHTML = `<div class="empty-state"><h3>No tasks on this job yet</h3><p>Use "+ Add Item" below to add the first one.</p></div>`;
    return;
  }
  scroll.innerHTML = `
    <table>
      <thead><tr><th>No.</th><th>Item</th><th>Description</th><th>Qty</th><th>Unit</th><th>Doer</th><th>Planned Start</th><th>Planned Finish</th><th>Actual</th><th>Delay</th><th>Status</th><th></th></tr></thead>
      <tbody id="tasks-tbody">${currentTasks.map((t, i) => taskRowHtml(t, i)).join("")}</tbody>
    </table>`;
}

function patchTaskInMemory(updated) {
  const idx = currentTasks.findIndex(t => t.id === updated.id);
  if (idx !== -1) currentTasks[idx] = updated;
}

function updateRowComputedCells(t) {
  const row = document.querySelector(`tr[data-task-row="${t.id}"]`);
  if (!row) return;
  const actualCell = row.querySelector(".actual-cell");
  if (actualCell) actualCell.innerHTML = `${formatDate(t.actual_start_date)} → <b>${formatDate(t.actual_finish_date)}</b>`;
  const delayCell = row.querySelector(".delay-cell");
  if (delayCell) delayCell.innerHTML = t.delay_days > 0 ? `<span class="delay-tag">${t.delay_days}d</span>` : "—";
}

async function handleStatusChange(taskId, newStatus) {
  const cur = currentTasks.find(t => t.id === taskId);
  const patch = { status: newStatus };
  if (newStatus === "in_progress" && !cur?.actual_start_date) {
    patch.actual_start_date = localDateStr();
  } else if (newStatus === "completed") {
    if (!cur?.actual_start_date) patch.actual_start_date = localDateStr();
    if (!cur?.actual_finish_date) patch.actual_finish_date = localDateStr();
  }
  const { data: updated, error } = await supabaseClient
    .from("job_tasks").update(patch).eq("id", taskId).select().single();
  if (error) {
    alert("Couldn't update status: " + error.message);
    return;
  }
  patchTaskInMemory(updated);
  updateRowComputedCells(updated);
  updateHeaderStats();
}

// ---- Cell selection / navigation ----
let editingCell = null;

function cellAt(row, col) {
  return document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
}
function selectCell(cell) {
  if (cell) cell.focus();
}
function moveSelection(cell, dRow, dCol) {
  const row = parseInt(cell.dataset.row, 10);
  const col = parseInt(cell.dataset.col, 10);
  const target = cellAt(row + dRow, col + dCol);
  if (target) selectCell(target);
}
function moveTab(cell, forward) {
  const row = parseInt(cell.dataset.row, 10);
  const col = parseInt(cell.dataset.col, 10);
  const maxCol = COLUMNS.length - 1;
  let r = row, c = col;
  if (forward) { if (c < maxCol) c++; else { c = 0; r++; } }
  else { if (c > 0) c--; else { c = maxCol; r--; } }
  const target = cellAt(r, c);
  if (target) selectCell(target);
}

// ---- Entering / leaving edit mode ----
function enterEditMode(cell, opts = {}) {
  if (editingCell === cell) return;
  if (editingCell) commitEdit(editingCell, null);

  const type = cell.dataset.type;
  const currentValue = cell.dataset.value || "";
  cell.classList.add("editing");

  if (type === "text" || type === "number") {
    const seed = opts.initialChar !== undefined ? opts.initialChar : currentValue;
    cell.innerHTML = `<input class="cell-input" type="${type === "number" ? "number" : "text"}" ${type === "number" ? 'step="any"' : ""} value="${escapeAttr(seed)}">`;
    const input = cell.querySelector(".cell-input");
    input.focus();
    // Typed-to-start-editing (initialChar set): put the cursor AFTER that
    // character, not before — text inputs default the caret to position 0
    // for a freshly-set value, which would put further typing ahead of it.
    // (setSelectionRange throws on type=number, so skip it there.)
    if (opts.initialChar === undefined) input.select();
    else if (type === "text") input.setSelectionRange(seed.length, seed.length);
  } else if (type === "date") {
    cell.innerHTML = `<input class="cell-input" type="date" value="${escapeAttr(currentValue)}">`;
    cell.querySelector(".cell-input").focus();
  } else if (type.startsWith("combo")) {
    const seed = opts.initialChar !== undefined ? opts.initialChar : labelFor(type, currentValue);
    cell.innerHTML = `<input class="cell-input combo-input" type="text" value="${escapeAttr(seed)}" autocomplete="off"><div class="combo-list"></div>`;
    const input = cell.querySelector(".cell-input");
    input.focus();
    if (opts.initialChar === undefined) input.select();
    else input.setSelectionRange(seed.length, seed.length);
    // When opening via click/F2/dblclick (no typed character), the input is
    // seeded with the current label just for display/selection purposes —
    // but the dropdown must show ALL options (current one highlighted), not
    // just options matching that label text. Only filter by the seed when
    // the user actually typed a character to start editing.
    renderComboList(cell, opts.initialChar !== undefined ? seed : "", { preserveCurrent: opts.initialChar === undefined });
    positionComboList(cell);
  }
  editingCell = cell;
}

function renderCellDisplay(cell) {
  const type = cell.dataset.type;
  const value = cell.dataset.value || "";
  const isCombo = type.startsWith("combo");
  let text = isCombo ? labelFor(type, value) : (type === "date" ? formatDate(value) : value);
  if (isCombo && text === "") text = "—";
  const caret = isCombo ? `<span class="combo-caret">&#9662;</span>` : "";
  cell.innerHTML = `${escapeHtml(String(text))}${caret}`;
}

function exitEditModeDom(cell) {
  cell.classList.remove("editing");
  renderCellDisplay(cell);
}

function cancelEdit(cell) {
  if (editingCell !== cell) return;
  editingCell = null;
  exitEditModeDom(cell);
  selectCell(cell);
}

async function commitEdit(cell, moveDir, opts = {}) {
  if (editingCell !== cell) return;
  editingCell = null;
  const type = cell.dataset.type;
  const input = cell.querySelector(".cell-input");
  let raw;
  if (type === "text") raw = input.value.trim();
  else if (type === "number") raw = input.value;
  else if (type === "date") raw = input.value;
  else if (type.startsWith("combo")) raw = resolveComboValue(cell, type);

  await saveCellValue(cell, type, raw);
  exitEditModeDom(cell);

  // A "silent" commit (the input lost focus because the user clicked
  // somewhere else entirely — see the focusout handler) must NOT grab focus
  // back: by the time this async save resolves, the browser may already have
  // focused whatever the user actually clicked, and calling .focus() here
  // would yank it back to this cell out from under them.
  if (opts.silent) return;

  // Removing the <input> drops focus to <body>, so re-focus this cell first —
  // moveSelection/moveTab below then override that focus only if a target
  // cell actually exists (e.g. no row below the last one).
  selectCell(cell);

  if (moveDir === "down") moveSelection(cell, 1, 0);
  else if (moveDir === "right") moveTab(cell, true);
  else if (moveDir === "left") moveTab(cell, false);
}

async function saveCellValue(cell, type, rawNewValue) {
  const taskId = cell.dataset.id;
  const field = cell.dataset.field;

  if (field === "status") {
    if (rawNewValue === null) return; // no match / cleared — revert, status can't be blank
    if (rawNewValue.value !== cell.dataset.value) await handleStatusChange(taskId, rawNewValue.value);
    cell.dataset.value = rawNewValue.value;
    return;
  }

  let value;
  if (type === "number") value = rawNewValue === "" ? null : parseFloat(rawNewValue);
  else if (type === "date") value = rawNewValue || null;
  else if (type.startsWith("combo")) {
    if (rawNewValue === null) return; // doer must resolve to a real person or Unassigned — revert if not
    value = rawNewValue.value || null;
  } else value = rawNewValue;

  const prev = currentTasks.find(t => t.id === taskId)?.[field] ?? null;
  const prevCompare = prev === null || prev === undefined ? "" : String(prev);
  const newCompare = value === null || value === undefined ? "" : String(value);
  if (prevCompare === newCompare) {
    cell.dataset.value = value ?? "";
    return;
  }

  const { data: updated, error } = await supabaseClient
    .from("job_tasks").update({ [field]: value }).eq("id", taskId).select().single();
  if (error) {
    alert("Couldn't save: " + error.message);
    return;
  }
  patchTaskInMemory(updated);
  cell.dataset.value = updated[field] ?? "";
  updateRowComputedCells(updated);
}

async function clearCell(cell) {
  const type = cell.dataset.type;
  if (type === "combo-status") return; // required field, nothing to clear to
  let raw;
  if (type === "combo-doer") raw = { value: "", label: "Unassigned" };
  else if (type === "combo-uom") raw = { value: "", label: "" };
  else raw = "";
  await saveCellValue(cell, type, raw);
  renderCellDisplay(cell);
}

// ---- Searchable dropdown (Unit / Doer / Status) ----
function renderComboList(cell, query, opts = {}) {
  const type = cell.dataset.type;
  const list = cell.querySelector(".combo-list");
  if (!list) return;
  const options = optionsForType(type);
  const q = (query || "").trim().toLowerCase();
  const filtered = q ? options.filter(o => o.label.toLowerCase().includes(q)) : options;

  if (!filtered.length) {
    list.innerHTML = type === "combo-uom"
      ? `<div class="combo-empty">No matching unit — press Enter to use "${escapeHtml(query)}"</div>`
      : `<div class="combo-empty">No matches</div>`;
    return;
  }

  // Opening a cell that already has a value (click/F2/double-click, no typed
  // filter yet) highlights that current option — or nothing, if it's unset —
  // so pressing Enter without typing anything is a true no-op. Once the user
  // is actively filtering (typed a character), the first match is highlighted
  // like a normal autocomplete.
  let highlightIdx = -1;
  if (opts.preserveCurrent) {
    const currentValue = cell.dataset.value || "";
    highlightIdx = filtered.findIndex(o => String(o.value) === String(currentValue));
  } else if (q) {
    highlightIdx = 0;
  }

  list.innerHTML = filtered.map((o, i) =>
    `<div class="combo-option${i === highlightIdx ? " highlighted" : ""}" data-value="${escapeAttr(o.value)}">${escapeHtml(o.label)}</div>`
  ).join("");
}

// The list is position:fixed (viewport-relative) precisely so it can escape
// .tasks-scroll's overflow:auto clipping — this computes its coordinates
// from the cell's current on-screen position, and flips it above the cell
// when there isn't room below (e.g. the last row or two in the grid).
function positionComboList(cell) {
  const list = cell.querySelector(".combo-list");
  if (!list) return;
  const rect = cell.getBoundingClientRect();
  list.style.minWidth = Math.max(rect.width, 120) + "px";
  list.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - 160)) + "px";
  const spaceBelow = window.innerHeight - rect.bottom;
  const openUpward = spaceBelow < list.offsetHeight + 8 && rect.top > list.offsetHeight + 8;
  if (openUpward) {
    list.style.top = "";
    list.style.bottom = (window.innerHeight - rect.top + 2) + "px";
  } else {
    list.style.bottom = "";
    list.style.top = (rect.bottom + 2) + "px";
  }
}

function resolveComboValue(cell, type) {
  const input = cell.querySelector(".cell-input");
  const list = cell.querySelector(".combo-list");
  const highlighted = list?.querySelector(".combo-option.highlighted");
  const options = optionsForType(type);

  if (highlighted) {
    const val = highlighted.dataset.value;
    return options.find(o => String(o.value) === val) || { value: val, label: highlighted.textContent };
  }
  const typed = input.value.trim();
  if (typed === "") {
    if (type === "combo-doer") return { value: "", label: "Unassigned" };
    if (type === "combo-uom") return { value: "", label: "" };
    return null;
  }
  const exact = options.find(o => o.label.toLowerCase() === typed.toLowerCase());
  if (exact) return exact;
  if (type === "combo-uom") return { value: typed, label: typed };
  return null;
}

// ---- Wiring ----
const tasksScroll = document.getElementById("tasks-scroll");

tasksScroll.addEventListener("keydown", (e) => {
  const cell = e.target.closest(".cell");
  if (!cell) return;
  const isEditing = cell.classList.contains("editing");

  if (!isEditing) {
    switch (e.key) {
      case "ArrowUp": e.preventDefault(); moveSelection(cell, -1, 0); return;
      case "ArrowDown": e.preventDefault(); moveSelection(cell, 1, 0); return;
      case "ArrowLeft": e.preventDefault(); moveSelection(cell, 0, -1); return;
      case "ArrowRight": e.preventDefault(); moveSelection(cell, 0, 1); return;
      case "Enter": e.preventDefault(); moveSelection(cell, 1, 0); return;
      case "Tab": e.preventDefault(); moveTab(cell, !e.shiftKey); return;
      case "F2": e.preventDefault(); enterEditMode(cell); return;
      case "Backspace": case "Delete": e.preventDefault(); clearCell(cell); return;
      default:
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault();
          enterEditMode(cell, { initialChar: e.key });
        }
        return;
    }
  }

  if (cell.dataset.type.startsWith("combo")) {
    const list = cell.querySelector(".combo-list");
    const options = Array.from(list?.querySelectorAll(".combo-option") || []);
    const highlighted = list?.querySelector(".combo-option.highlighted");
    const idx = options.indexOf(highlighted);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!options.length) return;
      options.forEach(o => o.classList.remove("highlighted"));
      const nextIdx = e.key === "ArrowDown" ? Math.min(idx + 1, options.length - 1) : Math.max(idx - 1, 0);
      const next = options[nextIdx] || options[0];
      next.classList.add("highlighted");
      next.scrollIntoView({ block: "nearest" });
      return;
    }
    if (e.key === "Enter") { e.preventDefault(); commitEdit(cell, "down"); return; }
    if (e.key === "Tab") { e.preventDefault(); commitEdit(cell, e.shiftKey ? "left" : "right"); return; }
    if (e.key === "Escape") { e.preventDefault(); cancelEdit(cell); return; }
    return; // other keys: let the text input take them (filtering handled by the 'input' listener)
  }

  // plain text / number / date cell, editing
  if (e.key === "Enter") { e.preventDefault(); commitEdit(cell, "down"); return; }
  if (e.key === "Tab") { e.preventDefault(); commitEdit(cell, e.shiftKey ? "left" : "right"); return; }
  if (e.key === "Escape") { e.preventDefault(); cancelEdit(cell); return; }
  // ArrowUp/Down/Left/Right fall through untouched — native text-cursor / date-segment behavior
});

tasksScroll.addEventListener("input", (e) => {
  if (!e.target.classList.contains("combo-input")) return;
  const cell = e.target.closest(".cell");
  renderComboList(cell, e.target.value);
  positionComboList(cell); // list height changes as filtering narrows/widens results
});

// The list's position is computed once when it opens (and again per
// keystroke); if the grid itself scrolls while it's open, that position
// goes stale, so just close it rather than leave a floating dropdown
// detached from its cell.
tasksScroll.addEventListener("scroll", () => {
  if (editingCell && editingCell.dataset.type.startsWith("combo")) cancelEdit(editingCell);
});

tasksScroll.addEventListener("mousedown", (e) => {
  const opt = e.target.closest(".combo-option");
  if (!opt) return;
  e.preventDefault(); // keep the input from blurring before we act on the click
  const cell = opt.closest(".cell");
  cell.querySelectorAll(".combo-option").forEach(o => o.classList.remove("highlighted"));
  opt.classList.add("highlighted");
  commitEdit(cell, null);
});

tasksScroll.addEventListener("click", (e) => {
  const removeBtn = e.target.closest("[data-remove-task]");
  if (removeBtn) { removeItem(removeBtn.dataset.removeTask); return; }
  const cell = e.target.closest(".cell");
  if (cell && cell.dataset.type.startsWith("combo") && !cell.classList.contains("editing")) {
    enterEditMode(cell);
  }
});

tasksScroll.addEventListener("dblclick", (e) => {
  const cell = e.target.closest(".cell");
  if (cell && !cell.classList.contains("editing")) enterEditMode(cell);
});

tasksScroll.addEventListener("focusout", (e) => {
  if (!e.target.classList.contains("cell-input")) return;
  const cell = e.target.closest(".cell");
  if (!cell || editingCell !== cell) return;
  commitEdit(cell, null, { silent: true });
});

async function addItem() {
  const maxNo = currentTasks.reduce((m, t) => Math.max(m, t.task_no || 0), 0);
  const { data: newTask, error } = await supabaseClient.from("job_tasks").insert({
    job_id: jobId,
    task_no: maxNo + 1,
    item_name: "New Item",
    status: "pending",
  }).select().single();
  if (error) {
    alert("Couldn't add item: " + error.message);
    return;
  }
  currentTasks.push(newTask);
  if (currentTasks.length === 1) {
    renderTasksTable();
  } else {
    document.getElementById("tasks-tbody").insertAdjacentHTML("beforeend", taskRowHtml(newTask, currentTasks.length - 1));
  }
  updateHeaderStats();
  cellAt(currentTasks.length - 1, 0)?.focus();
}

async function removeItem(taskId) {
  if (!confirm("Remove this item from the job?")) return;
  const { error } = await supabaseClient.from("job_tasks").delete().eq("id", taskId);
  if (error) {
    alert("Couldn't remove: " + error.message);
    return;
  }
  currentTasks = currentTasks.filter(t => t.id !== taskId);
  updateHeaderStats();
  renderTasksTable(); // row indices shift, so just re-render cleanly
}

document.getElementById("add-item-btn").addEventListener("click", addItem);

renderSidebar("dashboard");
(async () => {
  const auth = await requireAuth();
  if (!auth) return;
  renderHeaderUser(auth.profile);

  if (!jobId) {
    document.getElementById("project-header").innerHTML = `<p class="muted">No job specified.</p>`;
    return;
  }

  const [{ data: job, error }, { data: profiles }, { data: supervisors }, { data: tasks }] = await Promise.all([
    supabaseClient.from("jobs").select("*, product_types(name)").eq("id", jobId).single(),
    supabaseClient.from("profiles").select("id, full_name"),
    supabaseClient.from("supervisors").select("id, name"),
    supabaseClient.from("job_tasks").select("*").eq("job_id", jobId).order("task_no"),
  ]);

  if (error || !job) {
    document.getElementById("project-header").innerHTML = `<p class="muted">Job not found.</p>`;
    return;
  }

  currentJob = job;
  profilesList = profiles || [];
  supervisorNameById = Object.fromEntries((supervisors || []).map(s => [s.id, s.name]));
  currentTasks = tasks || [];

  document.getElementById("crumb-job").textContent = job.job_no;
  document.title = `${job.job_no} — Ref Conveyors Project Tracker`;

  renderHeader();
  renderTasksTable();
})();
</script>
