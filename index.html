<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ref Conveyors — Project Tracker</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark">RC</div>
      <div>
        <div class="logo-title">Ref Conveyors</div>
        <div class="logo-sub">Project Tracker</div>
      </div>
    </div>
    <h1>Sign in</h1>
    <p class="muted">Track every job, one place.</p>

    <div id="error-box" class="auth-error" style="display:none;"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary auth-submit" id="submit-btn">Sign in</button>
    </form>

    <div class="auth-footer">
      First time here? <a href="signup.html">Create an account</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script>
(async () => {
  // Already signed in? Skip straight to the dashboard.
  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.href = "dashboard.html";
})();

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorBox = document.getElementById("error-box");
  const btn = document.getElementById("submit-btn");
  errorBox.style.display = "none";
  btn.textContent = "Signing in…";
  btn.disabled = true;

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    errorBox.textContent = error.message === "Invalid login credentials"
      ? "Incorrect email or password."
      : error.message;
    errorBox.style.display = "block";
    btn.textContent = "Sign in";
    btn.disabled = false;
    return;
  }
  window.location.href = "dashboard.html";
});
</script>
</body>
</html>
