<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Book — Ref Conveyors Project Tracker</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
/* ---- Consolidated page header: title + bordered stats box on the left,
   Punch PO button + divider + user chip on the right — one flush row. ---- */
.page-header{display:flex; align-items:center; justify-content:space-between; gap:20px;}
.ph-left{min-width:0; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.ph-left h1{margin:0; white-space:nowrap;}
.ph-right{display:flex; align-items:center; gap:16px; flex-shrink:0;}
.ph-divider{width:1px; align-self:stretch; background:var(--border-strong);}
.ph-date{font-size:12.5px; font-weight:600; color:var(--text-muted); white-space:nowrap;}

/* Rectangular box for the 3 KPI chips, sitting right next to the title. A
   vertical rule (not the flex gap) separates each chip from the next, so
   there's a line after "Total Orders" and after "Awaiting Job Card" but not
   after the last chip. */
.ob-chip-group{display:flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:8px; padding:7px 0; flex-wrap:wrap;}
.ob-chip{display:flex; align-items:baseline; gap:6px; white-space:nowrap; padding:0 18px;}
.ob-chip:not(:last-child){border-right:1px solid var(--border-strong);}
.ob-chip-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:600;}
.ob-chip-value{font-family:'Manrope',sans-serif; font-size:15px; font-weight:700; color:var(--text);}
.ob-chip-value.stat-warn{color:var(--warn-text);}
.ob-chip-value.stat-success{color:var(--success-text);}
/* Same box-model as the shared .btn-secondary (Log out) so the two match
   height exactly: same padding/font, plus a transparent border to make up
   for .btn-primary normally having no border. */
.btn-punch-po{justify-content:center; padding:9px 16px; font-size:13px; border:1px solid transparent; flex-shrink:0;}

/* ---- Page runs edge-to-edge; the panel below the header is separated only
   by the header's own hairline bottom border, not padding/margin/shadow —
   no border of its own here, or the two 1px lines stack into a thick one. ---- */
.content-flush{padding:0 !important; display:flex; flex-direction:column; min-height:0;}
.app-shell-fill{height:100vh;}
.ob-panel{background:var(--surface); overflow:hidden; display:flex; flex-direction:column; flex:1; min-height:0;}
.ob-scroll{flex:1; min-height:0; overflow:auto; scrollbar-width:thin; scrollbar-color:var(--border-strong) var(--surface-2);}

/* ---- Spreadsheet-style grid table. border-collapse:separate (not
   collapse) + explicit right/bottom borders per cell — Chrome renders
   border-collapse:collapse badly once thead cells are position:sticky,
   doubling up into a thick header border. This is the same pattern already
   proven on job.html's sticky grid. ---- */
.ob-table{width:100%; border-collapse:separate; border-spacing:0;}
.ob-table thead th{position:sticky; top:0; z-index:5; text-align:center; vertical-align:middle; padding:8px 10px; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-muted); background:var(--surface-2); border-right:1px solid var(--border); border-bottom:1px solid var(--border); white-space:nowrap;}
.ob-table thead th:last-child{border-right:none;}
.ob-table td{padding:7px 10px; font-size:12.5px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); vertical-align:middle; background:var(--surface);}
.ob-table td:last-child{border-right:none;}
.ob-table tbody tr:last-child td{border-bottom:none;}
.ob-table tbody tr:hover td{background:var(--surface-2);}
.ob-sr{text-align:center; color:var(--text-faint); font-size:12px; width:44px;}
.ob-nowrap{white-space:nowrap;}

/* Truncated description with a custom hover tooltip (native title="" can't
   control width/wrapping) — the tooltip is width:100% of this cell, so it's
   exactly as wide as the (truncated) description column, and wraps the full
   text in full rather than clipping it. */
.ob-desc{position:relative; max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-muted); font-size:12.5px; cursor:default;}
.ob-desc-tip{display:none; position:absolute; left:0; top:100%; width:100%; box-sizing:border-box; margin-top:6px; white-space:normal; word-wrap:break-word; background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; padding:10px 12px; font-size:12.5px; line-height:1.5; color:var(--text); box-shadow:0 8px 24px rgba(20,24,40,0.18); z-index:30;}
.ob-desc:hover .ob-desc-tip{display:block;}

.ob-actions-cell{display:flex; gap:6px; justify-content:flex-end; flex-wrap:nowrap;}
.ob-actions-cell button, .ob-actions-cell a{white-space:nowrap;}
.ob-po-cell{text-align:center;}
.ob-empty-po{color:var(--text-faint); font-size:12px;}
.status-awaiting{background:var(--surface-2); color:var(--text-muted);}
/* Delivery countdown: still on time shows "- N days" plain; overdue flips
   to a plain "N days" with a red flag background. */
.ob-late-pill{display:inline-block; background:oklch(0.94 0.06 25); color:oklch(0.42 0.19 25); font-weight:700; padding:3px 9px; border-radius:6px;}
.template-note{background:var(--accent-soft); color:var(--accent-text); border-radius:8px; padding:10px 12px; font-size:12.5px; margin-top:4px; display:none;}
.modal-actions{display:flex; gap:10px; margin-top:20px;}
.po-file-row{display:flex; align-items:center; gap:10px; font-size:12.5px; background:var(--surface-2); border-radius:8px; padding:9px 12px;}
.po-file-row .muted{font-size:12px;}
</style>
</head>
<body>
<div class="app-shell app-shell-fill">
  <div id="sidebar-root"></div>
  <div class="main-area">
    <header class="page-header">
      <div class="ph-left">
        <h1>Order Book</h1>
        <div class="ob-chip-group" id="stats-cards"></div>
        <button type="button" class="btn-primary btn-punch-po" id="open-new-order">+ Punch New PO</button>
      </div>
      <div class="ph-right">
        <div class="ph-date" id="ph-date"></div>
        <div class="ph-divider"></div>
        <div id="header-user-root"></div>
      </div>
    </header>
    <main class="content content-flush">
      <div class="ob-panel">
        <div class="ob-scroll" id="orders-card">
          <div class="empty-state"><p>Loading…</p></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Punch New PO / Edit PO (same modal, mode toggled via order_id) -->
<div class="modal-overlay" id="new-order-modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="new-order-modal-title">Punch New PO</h2>
      <button type="button" class="modal-close" id="close-new-order" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div id="order-error-box" class="auth-error" style="display:none;"></div>
      <form id="new-order-form">
        <input type="hidden" id="order_id">
        <div class="modal-grid">
          <div class="field span-2">
            <label for="order_customer_name">Customer Name</label>
            <input id="order_customer_name" type="text" required>
          </div>
          <div class="field">
            <label for="order_client_po_number">Client's PO Number</label>
            <input id="order_client_po_number" type="text" required>
          </div>
          <div class="field span-3">
            <label for="order_description">Description of Material</label>
            <textarea id="order_description" rows="3" required style="width:100%; padding:9px 12px; border:1px solid var(--border-strong); border-radius:8px; font-size:13px; font-family:inherit; color:var(--text); background:var(--surface);"></textarea>
          </div>
          <div class="field">
            <label for="order_po_date">PO Date</label>
            <input id="order_po_date" type="date" required>
          </div>
          <div class="field">
            <label for="order_delivery_days">Delivery In Days</label>
            <input id="order_delivery_days" type="number" min="0" required>
          </div>
          <div class="field">
            <label for="order_delivery_reference">Delivery Time Starts From</label>
            <select id="order_delivery_reference" required>
              <option value="po_date">PO Date</option>
              <option value="advance_payment_date">Advance Payment Date</option>
            </select>
          </div>
          <div class="field" id="order_advance_date_field" style="display:none;">
            <label for="order_advance_payment_date">Advance Payment Date</label>
            <input id="order_advance_payment_date" type="date">
          </div>
          <div class="field span-3" id="current-po-file-row" style="display:none;">
            <div class="po-file-row">
              <button type="button" class="btn-secondary btn-sm" id="current-po-view-btn">View current PO file</button>
              <span class="muted">Choose a new file below only if you want to replace it.</span>
            </div>
          </div>
          <div class="field span-2">
            <label for="order_po_copy" id="order_po_copy_label">Attach PO Copy</label>
            <input id="order_po_copy" type="file" accept=".pdf,.jpg,.jpeg,.png">
          </div>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary" id="submit-new-order">Punch PO</button>
          <button type="button" class="btn-secondary" id="cancel-new-order">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Create Job Card from Order -->
<div class="modal-overlay" id="create-job-modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2>Create Job Card</h2>
      <button type="button" class="modal-close" id="close-create-job" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div id="create-job-error-box" class="auth-error" style="display:none;"></div>
      <form id="create-job-form">
        <input type="hidden" id="cj_order_id">
        <div class="modal-grid">
          <div class="field span-2">
            <label>Customer Name</label>
            <input id="cj_customer_name" type="text" disabled>
          </div>
          <div class="field">
            <label for="cj_product_type_id">Product Type</label>
            <select id="cj_product_type_id" required><option value="">Loading…</option></select>
          </div>
          <div class="field">
            <label for="cj_supervisor_id">Supervisor</label>
            <select id="cj_supervisor_id"><option value="">Unassigned</option></select>
          </div>
          <div class="field">
            <label for="cj_planned_start_date">Planned Start Date</label>
            <input id="cj_planned_start_date" type="date" required>
          </div>
          <div class="field">
            <label for="cj_target_date">Target Date</label>
            <input id="cj_target_date" type="date">
          </div>
        </div>
        <div id="cj-template-note" class="template-note"></div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary" id="submit-create-job">Create JC</button>
          <button type="button" class="btn-secondary" id="cancel-create-job">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script>
renderSidebar("order-book");

// "26 Aug, 2026 (Wed)" next to the avatar. MONTH_ABBR comes from auth.js.
const WEEKDAY_ABBR = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function todayHeaderLabel() {
  const d = new Date();
  return `${d.getDate()} ${MONTH_ABBR[d.getMonth()]}, ${d.getFullYear()} (${WEEKDAY_ABBR[d.getDay()]})`;
}
document.getElementById("ph-date").textContent = todayHeaderLabel();

const ORDER_STATUS_PILL = {
  not_started: ["status-notstarted", "Not Started"],
  in_progress: ["status-ontrack", "In Progress"],
  on_hold: ["status-delayed", "On Hold"],
  completed: ["status-completed", "Completed"],
};

let allOrders = [];
let templateCountByType = {};
let productTypeById = {};

function addDays(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + Math.round(days));
  return localDateStr(d);
}

function statusPillForOrder(order) {
  if (!order.jobs) return `<span class="status-pill status-awaiting"><span class="dot"></span>JC Pending</span>`;
  const [cls, label] = ORDER_STATUS_PILL[order.jobs.project_status] || ORDER_STATUS_PILL.not_started;
  return `<span class="status-pill ${cls}"><span class="dot"></span>${label}</span>`;
}

// Days between today and the delivery date. Positive = still time left,
// negative = overdue. Returns null when there's no delivery date to compare.
function deliveryDiffDays(order) {
  if (!order.delivery_date) return null;
  const today = new Date(localDateStr() + "T00:00:00");
  const delivery = new Date(order.delivery_date + "T00:00:00");
  return Math.round((delivery - today) / 86400000);
}

// Still pending -> "- N days" (plain). Overdue -> "N days" (red flag).
function pendingDaysCellHtml(order) {
  const diff = deliveryDiffDays(order);
  if (diff === null) return `<span class="ob-nowrap ob-empty-po">—</span>`;
  if (diff >= 0) return `<span class="ob-nowrap">- ${diff} day${diff === 1 ? "" : "s"}</span>`;
  const lateDays = Math.abs(diff);
  return `<span class="ob-late-pill">${lateDays} day${lateDays === 1 ? "" : "s"}</span>`;
}

// Most urgent first: overdue orders (by how overdue), then soonest-due,
// then furthest-out; orders with no delivery date sink to the bottom.
function sortOrdersByPending(orders) {
  return [...orders].sort((a, b) => {
    const da = deliveryDiffDays(a);
    const db = deliveryDiffDays(b);
    if (da === null && db === null) return 0;
    if (da === null) return 1;
    if (db === null) return -1;
    return da - db;
  });
}

// Private bucket — every view needs a freshly signed URL rather than a
// stored public link.
async function viewPoFile(path) {
  if (!path) return;
  const { data, error } = await supabaseClient.storage.from("po-copies").createSignedUrl(path, 120);
  if (error) { alert("Couldn't open PO file: " + error.message); return; }
  window.open(data.signedUrl, "_blank");
}

async function loadOrders() {
  const { data, error } = await supabaseClient
    .from("orders")
    .select("*, jobs(id, job_no, project_status)")
    .order("created_at", { ascending: false });
  if (error) {
    document.getElementById("orders-card").innerHTML =
      `<div class="empty-state"><h3>Couldn't load Order Book</h3><p>${escapeHtml(error.message)}</p></div>`;
    return;
  }
  allOrders = data || [];
  renderStats();
  renderOrdersTable();
}

function renderStats() {
  const total = allOrders.length;
  const awaiting = allOrders.filter(o => !o.jobs).length;
  const completed = allOrders.filter(o => o.jobs && o.jobs.project_status === "completed").length;
  document.getElementById("stats-cards").innerHTML = `
    <div class="ob-chip"><span class="ob-chip-label">Total Orders</span><span class="ob-chip-value">${total}</span></div>
    <div class="ob-chip"><span class="ob-chip-label">Awaiting Job Card</span><span class="ob-chip-value stat-warn">${awaiting}</span></div>
    <div class="ob-chip"><span class="ob-chip-label">Completed</span><span class="ob-chip-value stat-success">${completed}</span></div>
  `;
}

function renderOrdersTable() {
  const card = document.getElementById("orders-card");
  if (!allOrders.length) {
    card.innerHTML = `
      <div class="empty-state">
        <h3>No orders yet</h3>
        <p>Punch your first PO to start tracking it.</p>
        <button type="button" class="btn-primary" onclick="openNewOrderModal()">+ Punch New PO</button>
      </div>`;
    return;
  }
  const rows = sortOrdersByPending(allOrders);
  card.innerHTML = `
    <table class="ob-table">
      <thead><tr>
        <th>Sr. No</th><th>Order No.</th><th>Customer</th><th>Description</th><th>Client PO No.</th>
        <th class="ob-nowrap">PO Date</th><th class="ob-nowrap">Delivery Date</th><th class="ob-nowrap">Pending Days</th><th>PO File</th><th>Status</th><th></th>
      </tr></thead>
      <tbody>
        ${rows.map((o, i) => `
          <tr>
            <td class="ob-sr">${i + 1}</td>
            <td>${escapeHtml(o.order_no)}</td>
            <td>${escapeHtml(o.customer_name)}</td>
            <td>
              <div class="ob-desc">${escapeHtml(o.description_of_material || "—")}
                <div class="ob-desc-tip">${escapeHtml(o.description_of_material || "No description entered.")}</div>
              </div>
            </td>
            <td>${escapeHtml(o.client_po_number || "—")}</td>
            <td class="ob-nowrap">${formatDate(o.po_date)}</td>
            <td class="ob-nowrap">${formatDate(o.delivery_date)}</td>
            <td class="ob-nowrap">${pendingDaysCellHtml(o)}</td>
            <td class="ob-po-cell">${o.po_copy_path
              ? `<button type="button" class="btn-secondary btn-sm" data-view-po="${escapeHtml(o.po_copy_path)}">View</button>`
              : `<span class="ob-empty-po">—</span>`}</td>
            <td>${statusPillForOrder(o)}</td>
            <td>
              <div class="ob-actions-cell">
                <button type="button" class="btn-secondary btn-sm" data-edit-order="${o.id}">Edit</button>
                ${o.jobs
                  ? `<a class="btn-secondary btn-sm" href="job.html?id=${o.jobs.id}">View JC</a>`
                  : `<button type="button" class="btn-primary btn-sm" data-create-job="${o.id}">Create JC</button>`}
              </div>
            </td>
          </tr>`).join("")}
      </tbody>
    </table>`;

  card.querySelectorAll("[data-create-job]").forEach(btn => {
    btn.addEventListener("click", () => openCreateJobModal(btn.dataset.createJob));
  });
  card.querySelectorAll("[data-edit-order]").forEach(btn => {
    btn.addEventListener("click", () => openNewOrderModal(btn.dataset.editOrder));
  });
  card.querySelectorAll("[data-view-po]").forEach(btn => {
    btn.addEventListener("click", () => viewPoFile(btn.dataset.viewPo));
  });
}

// ---- Punch New PO / Edit PO modal ----
function openNewOrderModal(orderId) {
  const form = document.getElementById("new-order-form");
  form.reset();
  document.getElementById("order-error-box").style.display = "none";
  document.getElementById("order_id").value = "";
  document.getElementById("order_advance_date_field").style.display = "none";
  document.getElementById("order_advance_payment_date").required = false;
  document.getElementById("current-po-file-row").style.display = "none";

  if (orderId) {
    const order = allOrders.find(o => o.id === orderId);
    document.getElementById("new-order-modal-title").textContent = "Edit PO — " + order.order_no;
    document.getElementById("submit-new-order").textContent = "Save Changes";
    document.getElementById("order_id").value = order.id;
    document.getElementById("order_customer_name").value = order.customer_name || "";
    document.getElementById("order_client_po_number").value = order.client_po_number || "";
    document.getElementById("order_description").value = order.description_of_material || "";
    document.getElementById("order_po_date").value = order.po_date || "";
    document.getElementById("order_delivery_days").value = order.delivery_days ?? "";
    document.getElementById("order_delivery_reference").value = order.delivery_start_reference || "po_date";

    const isAdvance = order.delivery_start_reference === "advance_payment_date";
    document.getElementById("order_advance_date_field").style.display = isAdvance ? "block" : "none";
    const advInput = document.getElementById("order_advance_payment_date");
    advInput.required = isAdvance;
    advInput.value = order.advance_payment_date || "";

    const fileInput = document.getElementById("order_po_copy");
    fileInput.required = !order.po_copy_path;
    document.getElementById("order_po_copy_label").textContent = order.po_copy_path ? "Replace PO Copy (optional)" : "Attach PO Copy";
    if (order.po_copy_path) {
      const row = document.getElementById("current-po-file-row");
      row.style.display = "block";
      row.querySelector("#current-po-view-btn").dataset.path = order.po_copy_path;
    }
  } else {
    document.getElementById("new-order-modal-title").textContent = "Punch New PO";
    document.getElementById("submit-new-order").textContent = "Punch PO";
    document.getElementById("order_po_copy").required = true;
    document.getElementById("order_po_copy_label").textContent = "Attach PO Copy";
  }
  document.getElementById("new-order-modal").hidden = false;
}
function closeNewOrderModal() { document.getElementById("new-order-modal").hidden = true; }

document.getElementById("open-new-order").addEventListener("click", () => openNewOrderModal());
document.getElementById("close-new-order").addEventListener("click", closeNewOrderModal);
document.getElementById("cancel-new-order").addEventListener("click", closeNewOrderModal);
document.getElementById("new-order-modal").addEventListener("click", (e) => {
  if (e.target.id === "new-order-modal") closeNewOrderModal();
});
document.getElementById("current-po-view-btn").addEventListener("click", (e) => {
  viewPoFile(e.currentTarget.dataset.path);
});
document.getElementById("order_delivery_reference").addEventListener("change", (e) => {
  const isAdvance = e.target.value === "advance_payment_date";
  document.getElementById("order_advance_date_field").style.display = isAdvance ? "block" : "none";
  document.getElementById("order_advance_payment_date").required = isAdvance;
});

document.getElementById("new-order-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("order-error-box");
  const btn = document.getElementById("submit-new-order");
  const orderId = document.getElementById("order_id").value || null;
  errorBox.style.display = "none";
  btn.disabled = true;
  btn.textContent = orderId ? "Saving…" : "Punching…";

  const { data: { session } } = await supabaseClient.auth.getSession();

  const payload = {
    customer_name: document.getElementById("order_customer_name").value.trim(),
    client_po_number: document.getElementById("order_client_po_number").value.trim() || null,
    description_of_material: document.getElementById("order_description").value.trim() || null,
    po_date: document.getElementById("order_po_date").value || null,
    delivery_days: document.getElementById("order_delivery_days").value ? Number(document.getElementById("order_delivery_days").value) : null,
    delivery_start_reference: document.getElementById("order_delivery_reference").value,
    advance_payment_date: document.getElementById("order_advance_payment_date").value || null,
  };

  let savedOrder;
  if (orderId) {
    const { data, error } = await supabaseClient.from("orders").update(payload).eq("id", orderId).select().single();
    if (error) {
      errorBox.textContent = "Couldn't save changes: " + error.message;
      errorBox.style.display = "block";
      btn.textContent = "Save Changes"; btn.disabled = false;
      return;
    }
    savedOrder = data;
  } else {
    const { data: order_no, error: noError } = await supabaseClient.rpc("next_order_no");
    if (noError) {
      errorBox.textContent = "Couldn't generate an order number: " + noError.message;
      errorBox.style.display = "block";
      btn.textContent = "Punch PO"; btn.disabled = false;
      return;
    }
    payload.order_no = order_no;
    payload.created_by = session.user.id;
    const { data, error } = await supabaseClient.from("orders").insert(payload).select().single();
    if (error) {
      errorBox.textContent = "Couldn't punch PO: " + error.message;
      errorBox.style.display = "block";
      btn.textContent = "Punch PO"; btn.disabled = false;
      return;
    }
    savedOrder = data;
  }

  const file = document.getElementById("order_po_copy").files[0];
  if (file) {
    const path = `${savedOrder.id}/${file.name}`;
    const { error: uploadError } = await supabaseClient.storage.from("po-copies").upload(path, file, { upsert: true });
    if (!uploadError) {
      await supabaseClient.from("orders").update({ po_copy_path: path }).eq("id", savedOrder.id);
    }
  }

  btn.disabled = false;
  closeNewOrderModal();
  loadOrders();
});

// ---- Create Job Card modal ----
async function loadCreateJobDropdowns() {
  const [{ data: productTypes }, { data: supervisors }, { data: templates }] = await Promise.all([
    supabaseClient.from("product_types").select("id, name, code_prefix").order("name"),
    supabaseClient.from("supervisors").select("id, name").order("name"),
    supabaseClient.from("task_templates").select("product_type_id"),
  ]);
  templateCountByType = {};
  (templates || []).forEach(t => {
    templateCountByType[t.product_type_id] = (templateCountByType[t.product_type_id] || 0) + 1;
  });
  productTypeById = Object.fromEntries((productTypes || []).map(pt => [pt.id, pt]));

  const ptSelect = document.getElementById("cj_product_type_id");
  ptSelect.innerHTML = (productTypes || []).map(pt => {
    const hasTemplate = !!templateCountByType[pt.id];
    const suffix = hasTemplate ? "" : (pt.name === "Blank Sheet" ? " (manual entry)" : " (no template — blank sheet)");
    return `<option value="${pt.id}">${escapeHtml(pt.name)}${suffix}</option>`;
  }).join("") || `<option value="">No product types found</option>`;

  const svSelect = document.getElementById("cj_supervisor_id");
  svSelect.innerHTML = `<option value="">Unassigned</option>` + (supervisors || []).map(s =>
    `<option value="${s.id}">${escapeHtml(s.name)}</option>`
  ).join("");

  updateCjTemplateNote();
}

function updateCjTemplateNote() {
  const select = document.getElementById("cj_product_type_id");
  const ptId = select.value;
  const note = document.getElementById("cj-template-note");
  const count = templateCountByType[ptId] || 0;
  const pt = productTypeById[ptId];
  const prefix = (pt && pt.code_prefix) || "JOB";
  const prefixNote = `Job number will be auto-generated as ${prefix}-0001 style.`;
  note.style.display = "block";
  if (count > 0) {
    note.textContent = `This will create ${count} task${count > 1 ? "s" : ""} from the "${select.selectedOptions[0]?.textContent}" template. ${prefixNote}`;
  } else {
    note.textContent = `This will create a blank job card with the standard task columns (item, qty, UOM, dates, etc.) — add tasks manually on the job page, same as any other job. ${prefixNote}`;
  }
}
document.getElementById("cj_product_type_id").addEventListener("change", updateCjTemplateNote);

async function openCreateJobModal(orderId) {
  const order = allOrders.find(o => o.id === orderId);
  document.getElementById("create-job-form").reset();
  document.getElementById("create-job-error-box").style.display = "none";
  document.getElementById("cj_order_id").value = orderId;
  document.getElementById("cj_customer_name").value = order.customer_name;
  document.getElementById("cj_planned_start_date").value = localDateStr();
  document.getElementById("cj_target_date").value = order.delivery_date || "";
  await loadCreateJobDropdowns();
  document.getElementById("create-job-modal").hidden = false;
}
function closeCreateJobModal() { document.getElementById("create-job-modal").hidden = true; }
document.getElementById("close-create-job").addEventListener("click", closeCreateJobModal);
document.getElementById("cancel-create-job").addEventListener("click", closeCreateJobModal);
document.getElementById("create-job-modal").addEventListener("click", (e) => {
  if (e.target.id === "create-job-modal") closeCreateJobModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!document.getElementById("new-order-modal").hidden) closeNewOrderModal();
    if (!document.getElementById("create-job-modal").hidden) closeCreateJobModal();
  }
});

document.getElementById("create-job-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("create-job-error-box");
  const btn = document.getElementById("submit-create-job");
  const orderId = document.getElementById("cj_order_id").value;
  const order = allOrders.find(o => o.id === orderId);
  const product_type_id = document.getElementById("cj_product_type_id").value;
  const supervisor_id = document.getElementById("cj_supervisor_id").value || null;
  const planned_start_date = document.getElementById("cj_planned_start_date").value;
  const target_date = document.getElementById("cj_target_date").value;
  errorBox.style.display = "none";

  if (!product_type_id) {
    errorBox.textContent = "Please choose a product type.";
    errorBox.style.display = "block";
    return;
  }

  btn.textContent = "Creating…";
  btn.disabled = true;

  const { data: { session } } = await supabaseClient.auth.getSession();
  const { data: job_no, error: jobNoError } = await supabaseClient.rpc("next_job_no", { p_product_type_id: product_type_id });
  if (jobNoError) {
    errorBox.textContent = "Couldn't generate a job number: " + jobNoError.message;
    errorBox.style.display = "block";
    btn.textContent = "Create JC"; btn.disabled = false;
    return;
  }

  const { data: job, error: jobError } = await supabaseClient.from("jobs").insert({
    job_no,
    customer_name: order.customer_name,
    product_type_id,
    supervisor_id,
    planned_start_date: planned_start_date || null,
    target_date: target_date || null,
    created_by: session.user.id,
    order_id: orderId,
  }).select().single();

  if (jobError) {
    errorBox.textContent = "Couldn't create job: " + jobError.message;
    errorBox.style.display = "block";
    btn.textContent = "Create JC"; btn.disabled = false;
    return;
  }

  const { data: templates } = await supabaseClient
    .from("task_templates").select("*").eq("product_type_id", product_type_id).order("task_no");

  if (templates && templates.length) {
    let cursor = planned_start_date || localDateStr();
    const taskRows = templates.map(t => {
      const start = cursor;
      const finish = addDays(start, Math.max((t.default_duration_days || 1) - 1, 0));
      cursor = addDays(finish, 1);
      return {
        job_id: job.id, task_no: t.task_no, item_name: t.item_name, task_description: t.task_description,
        qty: t.default_qty, uom: t.default_uom, planned_start_date: start, planned_finish_date: finish,
        duration_days: t.default_duration_days,
      };
    });
    await supabaseClient.from("job_tasks").insert(taskRows);
  }
  // No templates for this product type (e.g. "Blank Sheet", or any product
  // type that hasn't had one loaded yet) — job.html's own loader detects the
  // empty task list and auto-adds one blank starter row, so the user still
  // lands on the full standard column grid, just with nothing pre-filled.

  window.location.href = "job.html?id=" + job.id;
});

(async () => {
  const auth = await requireAuth();
  if (!auth) return;
  renderHeaderUser(auth.profile);
  await loadOrders();
})();
</script>
