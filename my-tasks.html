<!doctype html>
<html lang="en">
<head>

<body>
<div class="app-shell">

    </main>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/auth.js"></script>
<script>
renderSidebar("my-tasks");
(async () => {
  const auth = await requireAuth();
  if (!auth) return;
  renderHeaderUser(auth.profile);
})();
</script>
